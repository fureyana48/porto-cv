<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARPIS nya si Sandi</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e2e; color: #cdd6f4; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .back-link { align-self: flex-start; margin-bottom: 15px; color: #89b4fa; text-decoration: none; font-size: 0.9em; font-weight: bold; transition: 0.2s; }
        .back-link:hover { color: #b4befe; text-decoration: underline; }
        .chat-container { width: 100%; max-width: 600px; background: #181825; border-radius: 10px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; flex: 1; max-height: 80vh; }
        h2 { text-align: center; color: #89b4fa; margin-top: 0; }
        #chat-box { flex: 1; min-height: 350px; overflow-y: auto; padding: 10px; background: #11111b; border-radius: 8px; margin-bottom: 15px; border: 1px solid #313244; }
        .msg { margin-bottom: 15px; padding: 10px; border-radius: 8px; max-width: 85%; line-height: 1.5; word-wrap: break-word; }
        .user-msg { background: #89b4fa; color: #11111b; margin-left: auto; border-bottom-right-radius: 0; }
        .ai-msg { background: #313244; color: #cdd6f4; margin-right: auto; border-bottom-left-radius: 0; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #45475a; background: #1e1e2e; color: #cdd6f4; outline: none; }
        button { padding: 12px 20px; background: #89b4fa; color: #11111b; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #b4befe; }
        button:disabled { background: #45475a; color: #6c7086; cursor: not-allowed; }
    </style>
</head>
<body>

<a href="/" class="back-link">&larr; Balik ke Home / CV Sandi</a>

<div class="chat-container">
    <h2>JARPIS nya si Sandi ala2 ngikut gaya ayronmen</h2>
    <div id="chat-box">
        <div class="msg ai-msg">apa njir? iye gw jarpisnya si Sandi. lau mo nanya ape?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ketik pesenan lu di mari, pesen ayam paket goceng gw tabok lu ye..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()" id="sendBtn">cium dulu, baru boleh mencet ini tombol</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const chatBox = document.getElementById("chat-box");
        const sendBtn = document.getElementById("sendBtn");
        const text = inputField.value.trim();
        
        if (!text) return;

        chatBox.innerHTML += `<div class="msg user-msg">${text}</div>`;
        inputField.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;
        
        inputField.disabled = true;
        sendBtn.disabled = true;
        sendBtn.innerHTML = "bentar, gw mikir dulu...";
        
        try {
            // Menggunakan jalur relatif aman dari HTTPS ke HTTPS domain yang sama
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: [{ role: 'user', content: text }]
                })
            });

            const data = await response.json();
            
            if (!response.ok) {
                throw new Error(data.error || `Server error: ${response.status}`);
            }

            if (!data.message || !data.message.content) {
                throw new Error("Format respons dari server tidak valid.");
            }

            const aiReply = data.message.content.replace(/\n/g, '<br>');
            chatBox.innerHTML += `<div class="msg ai-msg">${aiReply}</div>`;

        } catch (error) {
            console.error("Detail Error:", error);
            chatBox.innerHTML += `<div class="msg ai-msg" style="color: #f38ba8;">Error: lagi males mikir gw ah. (${error.message})</div>`;
        } finally {
            inputField.disabled = false;
            sendBtn.disabled = false;
            sendBtn.innerHTML = "cium dulu, baru boleh mencet ini tombol";
            inputField.focus();
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }
</script>

</body>
</html>
